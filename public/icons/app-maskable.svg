<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed ground with the mark held inside the 80% safe zone, so any
       platform mask (circle, squircle, rounded square) never clips it. -->
